name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tagged-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_geoapify_api_key: ${{ secrets.GEOAPIFY_API_KEY }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
      TF_VAR_owner_subject: ${{ secrets.OWNER_SUBJECT }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - run: bun install --frozen-lockfile
        working-directory: src/web

      - run: make test

      - run: make package

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"
        working-directory: infra

      - run: terraform plan -input=false -out=deployment.tfplan
        working-directory: infra

      - if: inputs.apply
        run: terraform apply -input=false deployment.tfplan
        working-directory: infra

      - if: inputs.apply
        run: terraform output website_url
        working-directory: infra
